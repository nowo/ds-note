name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: 检查（类型 + lint + 打包预检）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 打包预检（expo export，无需原生 SDK）
        run: npx expo export --platform android --no-bytecode --output-dir /tmp/export-check
